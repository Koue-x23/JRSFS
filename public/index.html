<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Johnrois Stainless Steel Fabrication Shop · Business Manager</title>
    <meta name="description" content="Business management for Johnrois Stainless Steel Fabrication Shop — quotations, invoices, service reports, billing statements, customers, payments and reports." />
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="brand">
          <img src="/assets/mark.svg" alt="" width="34" height="34" />
          <div class="brand-text">
            <strong>JOHNROIS</strong>
            <span>Stainless Fabrication</span>
          </div>
          <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu"></button>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot">
          <div class="sidebar-note">
            <span class="dot"></span> Local records database
          </div>
          <div class="sidebar-version">Business Manager v1.0</div>
        </div>
      </aside>
      <div class="sidebar-scrim" id="sidebar-scrim"></div>
      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"></button>
          <div class="topbar-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle"></p>
          </div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>
        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
